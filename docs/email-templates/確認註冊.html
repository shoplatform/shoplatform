<!doctype html>
<html lang="zh-Hant">
<body style="margin:0;background:#f5f3ef;font-family:Arial,'Noto Sans TC',sans-serif;color:#292724">
  <div style="max-width:560px;margin:0 auto;padding:36px 20px">
    <div style="background:#fff;border:1px solid #e5e0d8;border-radius:14px;padding:32px">
      <h1 style="margin:0 0 18px;font-size:24px">確認你的 Email</h1>
      <p style="margin:0 0 22px;line-height:1.7">你正在「你的平台名稱」建立帳號。請按下方按鈕確認這個 Email，完成後會回到網站繼續。</p>
      <p style="margin:0 0 24px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#292724;color:#fff;text-decoration:none;border-radius:8px;padding:12px 20px;font-weight:bold">確認 Email</a></p>
      <p style="margin:0;color:#706c65;font-size:13px;line-height:1.7">如果你沒有申請帳號，可以忽略這封信。請勿把這封信或連結轉寄給別人。</p>
    </div>
  </div>
