<!doctype html>
<html lang="zh-Hant">
<body style="margin:0;background:#f5f3ef;font-family:Arial,'Noto Sans TC',sans-serif;color:#292724">
  <div style="max-width:560px;margin:0 auto;padding:36px 20px">
    <div style="background:#fff;border:1px solid #e5e0d8;border-radius:14px;padding:32px">
      <h1 style="margin:0 0 18px;font-size:24px">重設密碼</h1>

      <p style="margin:0 0 24px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#292724;color:#fff;text-decoration:none;border-radius:8px;padding:12px 20px;font-weight:bold">設定新密碼</a></p>
      <p style="margin:0;color:#706c65;font-size:13px;line-height:1.7">如果不是你提出要求，可以忽略這封信；原本的密碼不會改變。請勿把這封信或連結轉寄給別人。</p>
